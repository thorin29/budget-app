name: Android CI

# Every push to main: run the unit tests, then build the signed release APK and
# keep it as a workflow artifact. Publishing an update to phones is a separate,
# deliberate step (release.yml).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  build:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add the four signing secrets (see RELEASING.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/budget-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/budget-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: budget-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Room's schema for this database version. Download it and commit it to
      # app/schemas once per schema version; migrations are built from it.
      - uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn
